[package]
name = "esp32-minimal-template"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }
esp-idf-hal = "0.46.2"
esp-idf-svc = "0.52"
log = "0.4"

[build-dependencies]
embuild = "0.33"

[profile.dev]
opt-level = "s"
panic = "abort"

[profile.release]
opt-level = "s"
panic = "abort"
lto = "off"
